name: Update gold & silver rates

# 04:15 UTC = 09:45 IST. GitHub schedules in UTC only.
#
# Deliberately 45 minutes before the 10:30 the shop cares about, because
# GitHub does not honour cron punctually — it queues scheduled jobs behind
# every other repo's, and the top of the hour is the worst moment to ask.
# Measured on this repo:
#
#   13 Aug  05:00 -> 06:13   +73 min
#   14 Aug  05:00 -> 06:10   +70 min
#   15 Aug  05:00 -> 05:20   +20 min
#   16 Aug  05:00 -> 05:23   +23 min
#
# An on-the-hour 05:00 therefore landed between 10:50 and 11:43 IST — always
# after the moment it was aimed at. Asking at :15 past avoids the hourly
# crush, and the 45-minute head start absorbs the rest. Runs are idempotent
# per India date, so arriving early costs nothing.
#
# GitHub can also skip a scheduled run entirely under load, or delay one far
# beyond anything the head start can absorb. Measured 27 Aug 2026:
#
#   27 Aug  04:15 -> 15:15   +660 min   -> published at 20:45 IST
#
# Every other day that month landed between 10:20 and 10:32 IST. That one
# run put an evening international spot price on the shop's board — not
# wrong data, but not the number the counter quotes in the morning either.
#
# HENCE THE TWO BACKSTOPS BELOW. They are not retries of a failed run; they
# are independent queue entries, so a backlog that swallows one does not
# necessarily swallow the next. On a normal day they cost NOTHING: the
# script keys idempotency on (India date + config hash), so a backstop that
# fires after a successful run prints "Already updated for <date>" and exits
# before touching the API. Quota is only ever spent on a day the earlier
# run did not land.
#
# Ordered so the last chance still beats the 10:30 the shop cares about
# under the +35..+47 min delay that is normal here.
on:
  schedule:
    - cron: "15 4 * * *"   # 09:45 IST — primary
    - cron: "20 3 * * *"   # 08:50 IST — early backstop
    - cron: "10 5 * * *"   # 10:40 IST — late backstop
  workflow_dispatch:
    inputs:
      force:
        description: "Re-fetch even if today's rates were already published (uses 2 API requests)"
        type: boolean
        default: false

# Only one rate run at a time, so two jobs can never both spend quota.
concurrency:
  group: metal-rates
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No install needed: the script uses only Node built-ins and global fetch.
      - name: Verify rate maths
        run: node scripts/fetch-rates.mjs --selftest

      - name: Fetch and publish rates
        env:
          GOLDAPI_KEY: ${{ secrets.GOLDAPI_KEY }}
        run: node scripts/fetch-rates.mjs ${{ inputs.force && '--force' || '' }}

      - name: Commit if the rates changed
        run: |
          if git diff --quiet -- public/rates.json data/rates-state.json; then
            echo "No change — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/rates.json data/rates-state.json
          git commit -m "chore(rates): daily gold & silver update"
          git push
