name: Update gold & silver rates

# 04:15 UTC = 09:45 IST. GitHub schedules in UTC only.
#
# Deliberately 45 minutes before the 10:30 the shop cares about, because
# GitHub does not honour cron punctually — it queues scheduled jobs behind
# every other repo's, and the top of the hour is the worst moment to ask.
# Measured on this repo:
#
#   13 Aug  05:00 -> 06:13   +73 min
#   14 Aug  05:00 -> 06:10   +70 min
#   15 Aug  05:00 -> 05:20   +20 min
#   16 Aug  05:00 -> 05:23   +23 min
#
# An on-the-hour 05:00 therefore landed between 10:50 and 11:43 IST — always
# after the moment it was aimed at. Asking at :15 past avoids the hourly
# crush, and the 45-minute head start absorbs the rest. Runs are idempotent
# per India date, so arriving early costs nothing.
#
# ── THEN IT GOT MUCH WORSE, AND THE FIX ABOVE STOPPED WORKING ────────
#
# From 27 Aug 2026 this repo's scheduled queue degraded badly:
#
#   27 Aug  1 cron    04:15 -> 15:15                      +11h
#   28 Aug  3 crons   -> ran 20:59, 22:09, 22:51 IST      +12h  (all three)
#   29 Aug  3 crons   -> ran 15:43, 16:36, 17:06 IST      +7h   (all three)
#   30 Aug  3 crons   -> nothing by 13:52 IST             skipped or pending
#
# Two backstop schedules were added on 28 Aug on the theory that GitHub's
# delays are independent per entry, so three entries would mean three
# chances. THAT THEORY WAS WRONG. The delays are correlated: the whole
# repo's schedule queue backs up by the same amount, so all three runs
# drift together. Three equally-late runs is not resilience.
#
# The backstops are therefore removed. They cost nothing (the idempotency
# guard makes a duplicate exit before the API call) but they bought
# nothing either, and leaving them in would imply a safety net that does
# not exist.
#
# ── WHAT ACTUALLY RUNS THIS NOW ──────────────────────────────────────
#
# An external cron service calls the GitHub API `workflow_dispatch`
# endpoint at 09:45 IST. Manually dispatched runs are NOT queued the way
# scheduled ones are — every manual run on this repo has started within
# seconds, including on the days when the scheduled runs were 12 hours
# late. That is the whole reason this works.
#
#   POST /repos/SkipAry/babajewellers/actions/workflows/update-rates.yml/dispatches
#   body: {"ref":"main"}
#
# The single `schedule` below is kept ONLY as a dead-man's fallback: if
# the external trigger ever stops (expired token, service down, someone
# deletes the job), GitHub will still run this eventually — late, but the
# board will not sit frozen for a week. It is a floor, not the mechanism.
on:
  schedule:
    - cron: "15 4 * * *"   # 09:45 IST — fallback only; see above
  workflow_dispatch:
    inputs:
      force:
        description: "Re-fetch even if today's rates were already published (uses 2 API requests)"
        type: boolean
        default: false

# Only one rate run at a time, so two jobs can never both spend quota.
concurrency:
  group: metal-rates
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No install needed: the script uses only Node built-ins and global fetch.
      - name: Verify rate maths
        run: node scripts/fetch-rates.mjs --selftest

      - name: Fetch and publish rates
        env:
          GOLDAPI_KEY: ${{ secrets.GOLDAPI_KEY }}
        run: node scripts/fetch-rates.mjs ${{ inputs.force && '--force' || '' }}

      - name: Commit if the rates changed
        run: |
          if git diff --quiet -- public/rates.json data/rates-state.json; then
            echo "No change — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/rates.json data/rates-state.json
          git commit -m "chore(rates): daily gold & silver update"
          git push
